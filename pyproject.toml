[project]
name = "dashcount"
version = "0.1.0"
description = "Geometry Dash x card counting: an intraday US stock bot with obstacle filters, an order-flow count, a local AI veto and a flight recorder."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "tzdata",
    "torch>=2.7",
    "einops>=0.8",
    "huggingface-hub>=0.33",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "lxml>=5",
    "pyside6>=6.7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[project.scripts]
dashcount = "dashcount.cli:main"

[project.gui-scripts]
dashcount-ui = "dashcount_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashcount", "src/dashcount_ui"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "models: needs the real Kronos weights / Ollama Fin-R1 (slow)",
]
